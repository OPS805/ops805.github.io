<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer black circle background -->
  <circle cx="100" cy="100" r="98" fill="#000" stroke="#f2f2f2" stroke-width="2"/>
  
  <!-- Inner circle ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#f2f2f2" stroke-width="1.5"/>
  
  <!-- OMEGA text at top -->
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#f2f2f2" text-anchor="middle" letter-spacing="2">OMEGA</text>
  
  <!-- Small orange lightning bolts -->
  <g fill="#ff6a00">
    <path d="M 30 45 L 35 55 L 32 55 L 38 68 L 28 58 L 31 58 Z"/>
    <path d="M 170 45 L 165 55 L 168 55 L 162 68 L 172 58 L 169 58 Z"/>
  </g>
  
  <!-- Central orange wrench/pipe symbol (simplified geometric wrench) -->
  <g fill="#ff6a00">
    <!-- Left part of wrench -->
    <rect x="60" y="75" width="18" height="50" rx="4" transform="rotate(-30 69 100)"/>
    <!-- Right part of wrench -->
    <rect x="122" y="75" width="18" height="50" rx="4" transform="rotate(30 131 100)"/>
    <!-- Center circle -->
    <circle cx="100" cy="100" r="12" fill="#ff6a00"/>
  </g>
  
  <!-- PLUMBING SERVICES text curved around bottom -->
  <defs>
    <path id="bottomCurve" d="M 40,100 A 60,60 0 0,1 160,100" fill="none"/>
  </defs>
  <text font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#999" letter-spacing="1">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">
      PLUMBING SERVICES
    </textPath>
  </text>
</svg>